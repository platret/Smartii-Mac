name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build app bundle
        run: bash Scripts/make-app.sh release

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/Smartii.app build/Smartii-mac.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Smartii-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
